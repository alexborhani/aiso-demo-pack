name: legal-matters
description: Legal matters and regulator correspondence — restricted, Legal

source:
  type: directory
  path: bundles/aiso-demo-pack/legal-matters
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: restricted
  categories: ["Legal"]
  auto: false
access:
  minRole: admin
# Who decides a request for access (Chat routes it to them).
owners:
  users: [dana]
egress:
  allowFrontier: false

search:
  defaultK: 5
