name: people-files
description: "People Operations: compensation bands, reviews, grievances — confidential, HR"

source:
  type: directory
  path: bundles/aiso-demo-pack/people-files
  pattern: "*.md"

loader:
  type: okf

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: confidential
  categories: ["HR"]
access:
  roles: [hr-partners]
egress:
  allowFrontier: false

search:
  defaultK: 5
