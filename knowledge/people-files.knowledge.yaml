name: people-files
description: "People Operations: compensation bands, reviews, grievances — confidential, HR"

source:
  type: directory
  path: bundles/aiso-demo-pack/people-files
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: confidential
  categories: ["HR"]
  auto: false
access:
  roles: [hr-partners]
egress:
  allowFrontier: false

search:
  defaultK: 5
