name: pet-store
description: Pet store inventory with species, breeds, pets, and supplies

# The rows come from scripts/export-demo-rows.py. Live questions (who bought what, what is
# available now) go to the demo-data MCP server, which answers with named queries.
source:
  type: file
  path: bundles/aiso-demo-pack/pet-store/pets.json

loader:
  type: json

splitter:
  type: character
  chunkSize: 500
  chunkOverlap: 50

embedding: default

search:
  defaultK: 5


graph:
  directMapping:
    entities:
      - type: Species
        idColumn: species_id
        nameColumn: species_name
        properties: []
      - type: Breed
        idColumn: breed_id
        nameColumn: breed_name
        properties:
          - size
          - temperament
          - avg_lifespan
      - type: Pet
        idColumn: pet_id
        nameColumn: pet_name
        properties:
          - age
          - price
          - status
    relationships:
      - type: IS_BREED
        source: Breed
        target: Species
        sourceIdColumn: breed_id
        targetIdColumn: species_id
      - type: BELONGS_TO
        source: Pet
        target: Breed
        sourceIdColumn: pet_id
        targetIdColumn: breed_id

classification:
  auto: false
