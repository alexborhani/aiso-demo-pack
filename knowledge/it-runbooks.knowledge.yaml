name: it-runbooks
description: IT runbooks for the helpdesk and the network team — internal

source:
  type: directory
  path: bundles/aiso-demo-pack/it-runbooks
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: internal
  auto: false

egress:
  allowFrontier: true

search:
  defaultK: 5
