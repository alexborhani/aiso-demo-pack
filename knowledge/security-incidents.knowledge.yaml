name: security-incidents
description: Security incidents, access reviews, test findings — restricted, Security

source:
  type: directory
  path: bundles/aiso-demo-pack/security-incidents
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: restricted
  categories: ["Security"]
  auto: false
access:
  minRole: admin
egress:
  allowFrontier: false

search:
  defaultK: 5
