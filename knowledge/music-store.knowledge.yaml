name: music-store
description: Music store catalog — artists, albums, tracks, and genres with graph relationships

# The rows come from scripts/export-demo-rows.py. Live questions (who bought what, what is
# available now) go to the demo-data MCP server, which answers with named queries.
source:
  type: file
  path: bundles/aiso-demo-pack/music-store/tracks.json

loader:
  type: json

splitter:
  type: character
  chunkSize: 500
  chunkOverlap: 0

embedding: default

search:
  defaultK: 10

graph:
  directMapping:
    entities:
      - type: Artist
        idColumn: artist_id
        nameColumn: artist_name
        properties: []
      - type: Album
        idColumn: album_id
        nameColumn: album_title
        properties: []
      - type: Track
        idColumn: track_id
        nameColumn: track_name
        properties:
          - composer
          - duration_ms
          - price
      - type: Genre
        idColumn: genre_id
        nameColumn: genre_name
        properties: []
    relationships:
      - type: PERFORMED_BY
        source: Album
        target: Artist
        sourceIdColumn: album_id
        targetIdColumn: artist_id
      - type: ON_ALBUM
        source: Track
        target: Album
        sourceIdColumn: track_id
        targetIdColumn: album_id
      - type: HAS_GENRE
        source: Track
        target: Genre
        sourceIdColumn: track_id
        targetIdColumn: genre_id

classification:
  auto: false
