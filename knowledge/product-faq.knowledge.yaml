name: product-faq
description: "Meridian Works product FAQ for customers: pump models, service intervals, warranty, spares, contacts — public, the store behind the published support page"

source:
  type: directory
  path: bundles/aiso-demo-pack/product-faq
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: public
  auto: false

egress:
  allowFrontier: true

search:
  defaultK: 5
