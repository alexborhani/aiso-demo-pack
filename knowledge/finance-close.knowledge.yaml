name: finance-close
description: "Finance: close packages, forecast, pricing — confidential, Finance"

source:
  type: directory
  path: bundles/aiso-demo-pack/finance-close
  pattern: "*.md"

loader:
  type: okf

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

