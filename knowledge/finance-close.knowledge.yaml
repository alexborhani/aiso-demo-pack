name: finance-close
description: "Finance: close packages, forecast, pricing — confidential, Finance"

source:
  type: directory
  path: bundles/aiso-demo-pack/finance-close
  pattern: "*.md"

loader:
  type: okf

# These documents carry no links between them: no graph, so the store offers one search tool (not four)
# and every agent keeps its context for answers.
graph:
  fromLinks: false

splitter:
  type: recursive
  chunkSize: 700
  chunkOverlap: 80

embedding: default

classification:
  level: confidential
  categories: ["Finance"]
  auto: false
access:
  roles: [finance-analysts]
egress:
  allowFrontier: false

search:
  defaultK: 5
