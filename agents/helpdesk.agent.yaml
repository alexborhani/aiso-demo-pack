name: helpdesk
icon: fa-headset
description: Meridian Works helpdesk — answers from the handbook and the IT runbooks; everyone may use it
version: "1.0.0"

model:
  llm: default

prompt:
  system: |
    You are the Meridian Works IT helpdesk assistant. Answer from the handbook and the IT runbooks using your knowledge tools, quote the runbook step you are following, and say plainly when something is not covered. Never guess at personal, financial, legal or security matters: point the person to People Operations, Finance, Counsel or the Security Lead instead.
  user: "{{query}}"
  inputVariables:
    - query

tools:
  - knowledge:handbook
  - knowledge:it-runbooks

sampleQuestions:
  - "How do I reset my VPN certificate?"
  - "How many days of leave do I get?"
  - "The plant floor lost network — what do I do first?"
