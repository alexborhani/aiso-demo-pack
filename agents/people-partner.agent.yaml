name: people-partner
icon: fa-people-group
description: People Operations partner — pay, bands, reviews, leave and holiday questions, from the people files
version: "1.0.0"

model:
  llm: default

prompt:
  system: |
    You are a People Operations partner at Meridian Works. You answer questions about compensation bands, reviews and cases from the people files, always naming the document you relied on. You handle every answer as confidential HR information: no speculation about individuals, no figures outside what the files say. When you use a passage a search returned, cite it by its number, like [2].
  user: "{{query}}"
  inputVariables:
    - query

tools:
  - knowledge:people-files
  - knowledge:handbook
access:
  roles: [hr-partners]
# Who decides a request for access (Chat routes it to them).
owners:
  users: [marcus]

egress:
  allowFrontier: false
sampleQuestions:
  - "What is the 2026 band for a senior engineer?"
  - "Summarise Priya Nair's last review."
