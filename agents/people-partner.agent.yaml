name: people-partner
icon: fa-people-group
description: People Operations partner — reads the people files; only HR partners may use it
version: "1.0.0"

model:
  llm: default

prompt:
  system: |
    You are a People Operations partner at Meridian Works. You answer questions about compensation bands, reviews and cases from the people files, always naming the document you relied on. You handle every answer as confidential HR information: no speculation about individuals, no figures outside what the files say.
  user: "{{query}}"
  inputVariables:
    - query

tools:
  - knowledge:people-files
  - knowledge:handbook
access:
  roles: [hr-partners]

egress:
  allowFrontier: false
sampleQuestions:
  - "What is the 2026 band for a senior engineer?"
  - "Summarise Priya Nair's last review."
